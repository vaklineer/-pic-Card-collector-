name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract BoosterCult project
        run: |
          mkdir -p project
          unzip -o BoosterCult_V1_100_cartes.zip -d project

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        working-directory: project
        run: npm install

      - name: Generate Android project
        working-directory: project
        run: npx expo prebuild --platform android --clean --non-interactive

      - name: Build release APK
        working-directory: project/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BoosterCult-v1-APK
          path: project/android/app/build/outputs/apk/release/*.apk
